<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Marketplace</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Local Marketplace</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="create.html" class="member-only">Create Listing</a>

            <a href="dashboard.html" class="member-only">My Listings</a>

            <a href="dashboard.html" class="moderator-only">Moderator Dashboard</a>

            <label for="roleSelect">Role:</label>

            <select id="roleSelect">
                <option value="visitor">Visitor</option>
                <option value="member">Member</option>
                <option value="moderator">Moderator</option>
            </select>

        </nav>
    </header>

    <main>


        <section id="hero">
            <h2>Buy, Sell and Exchange</h2>
            <p>Find great deals in your local community.</p>
        </section>

        <section id="filters">

            <div class="filter-group">
                <label for="searchInput">Search</label>
                <input type="text" id="searchInput" placeholder="Search listings">
            </div>

            <div class="filter-group">
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Books">Books</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Bikes">Bikes</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="typeFilter">Listing Type</label>
                <select id="typeFilter">
                    <option value="">All Types</option>
                    <option value="Sell">Sell</option>
                    <option value="Buy">Buy</option>
                    <option value="Exchange">Exchange</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="minPrice">Minimum Price</label>
                <input type="number" id="minPrice" min="0" placeholder="Min price">
            </div>

            <div class="filter-group">
                <label for="maxPrice">Maximum Price</label>
                <input type="number" id="maxPrice" min="0" placeholder="Max price">
            </div>

        </section>

        <section id="listings">

            <h2>Available Listings</h2>
            <div id="listingContainer"></div>

        </section>


    </main>

    <footer>
        <p>&copy; 2026 Local Marketplace</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="js/data.js"></script>
    <script src="js/roles.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
